[workspace]
members = [
    "benchmarks",
    "crates/zeno-cli",
    "crates/zeno-codec",
    "crates/zeno-config",
    "crates/zeno-consensus",
    "crates/zeno-crypto",
    "crates/zeno-evm",
    "crates/zeno-execution",
    "crates/zeno-genesis",
    "crates/zeno-hash",
    "crates/zeno-mempool",
    "crates/zeno-network",
    "crates/zeno-node",
    "crates/zeno-primitives",
    "crates/zeno-rpc",
    "crates/zeno-state",
    "crates/zeno-storage",
    "crates/zeno-test-utils",
    "crates/zeno-types",
    "crates/zeno-wallet",
    "crates/zeno-zk",
    "integration-tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["OpenAI Codex"]
repository = "https://example.invalid/zeno-pq-chain"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["macros", "tokio"] }
bincode = { version = "2.0.1", features = ["derive", "serde"] }
blake3 = "1.8.2"
bytes = { version = "1.10.1", features = ["serde"] }
clap = { version = "4.5.50", features = ["derive", "env"] }
criterion = { version = "0.7.0", features = ["async_tokio"] }
futures = "0.3.31"
hex = { version = "0.4.3", features = ["serde"] }
k256 = { version = "0.13", features = ["ecdsa"] }
humantime-serde = "1.1.1"
oqs = { version = "0.10.1", default-features = false, features = ["sigs", "vendored"] }
parking_lot = "0.12.5"
prometheus = { version = "0.13.4", features = ["process"] }
proptest = "1.9.0"
rand = "0.9.2"
revm = { version = "19.5.0", default-features = true }
rocksdb = { version = "0.24.0", default-features = false, features = ["bindgen-runtime", "multi-threaded-cf"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha3 = "0.10.8"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.16", features = ["codec"] }
toml = "0.9.8"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace", "cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = true
